<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: vault and note</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a68af9}a:hover{color:#c4b5fd}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1e1e1e; color: #dadada; font-family: -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 15px; position: relative; overflow: hidden">
  <div style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid #363636; color: #a3a3a3">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dadada">Acme renewal 2027</span>
    <button type="button" onClick="{{ toggle }}" aria-label="Vault and note" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: {{ iconBg }}; color: #4ade80; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg>
    </button>
  </div>
  <div style="padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; line-height: 1.6">
    <h1 style="margin: 0; font-size: 26px; color: #ececec">Acme renewal 2027</h1>
    <p style="margin: 0">Contract ends 31 January. Daniel spoke with their CFO on Monday; they want a two-year term and a price freeze on the support hours.</p>
  </div>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #262626; border-top: 1px solid #404040; border-radius: 14px 14px 0 0; padding-bottom: 24px">
      <div style="width: 36px; height: 4px; border-radius: 2px; background: #4a4a4a; margin: 8px auto 4px"></div>
      <div style="padding: 10px 20px 4px; font-size: 13px; color: #9a9a9a">Work notes</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 2px 20px 14px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80"></span>
        <span>Up to date</span>
        <span style="margin-left: auto; color: #9a9a9a">just now</span>
      </div>
      <div style="border-top: 1px solid #363636; padding: 14px 20px 4px; font-size: 13px; color: #9a9a9a">Acme renewal 2027</div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 2px 20px 10px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80"></span>
        <span>Synced</span>
      </div>
      <div style="padding: 0 20px 12px; display: grid; grid-template-columns: 110px minmax(0, 1fr); row-gap: 8px; column-gap: 10px">
        <span style="color: #9a9a9a">Last changed</span><span>Daniel, 3 min ago</span>
        <span style="color: #9a9a9a">Created</span><span>12 Nov</span>
      </div>
      <a href="#" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 20px; border-top: 1px solid #363636; color: #dadada; text-decoration: none">
        <span>Version history</span>
        <svg style="margin-left: auto" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    return {
      open: this.state.open,
      toggle: () => this.setState({ open: !this.state.open }),
      iconBg: this.state.open ? '#363636' : 'transparent'
    };
  }
}
</script>
</body>
</html>
