<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plugin settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#a68af9}a:hover{color:#c4b5fd}
</style>
</helmet>
<div style="width: 1000px; height: 760px; box-sizing: border-box; display: flex; background: #1e1e1e; color: #dadada; font-family: -apple-system, 'Segoe UI', Inter, Roboto, sans-serif; font-size: 14px; overflow: hidden">
  <div style="width: 220px; background: #262626; border-right: 1px solid #363636; padding: 20px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #b3b3b3">
    <div style="font-size: 11px; letter-spacing: .04em; color: #8a8a8a; padding: 0 10px 6px">OPTIONS</div>
    <div style="padding: 5px 10px">General</div>
    <div style="padding: 5px 10px">Editor</div>
    <div style="padding: 5px 10px">Files and links</div>
    <div style="font-size: 11px; letter-spacing: .04em; color: #8a8a8a; padding: 14px 10px 6px">COMMUNITY PLUGINS</div>
    <div style="padding: 5px 10px; background: #363636; border-radius: 4px; color: #ececec">Pantalytics</div>
  </div>
  <div style="flex: 1; padding: 32px 40px; display: flex; flex-direction: column; gap: 0; min-width: 0">
    <div style="color: #8a8a8a; font-size: 13px; padding-bottom: 18px">mcp.pantalytics.com</div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #363636">
      <div style="flex: 1"><div style="color: #ececec">Account</div><div style="color: #9a9a9a; font-size: 13px">Signed in.</div></div>
      <button type="button" style="height: 30px; padding: 0 14px; border: 1px solid #404040; border-radius: 6px; background: #2f2f2f; color: #dadada; font: inherit; font-size: 13px">Sign out</button>
    </div>

    <div style="border: 1px solid #404040; border-radius: 8px; margin: 10px 0 14px">
      <div style="display: flex; align-items: center; gap: 16px; padding: 14px 16px">
        <div style="flex: 1"><div style="color: #ececec">Cloud vault</div><div style="color: #9a9a9a; font-size: 13px">Work notes</div></div>
        <button type="button" style="height: 30px; padding: 0 14px; border: 1px solid #404040; border-radius: 6px; background: #2f2f2f; color: #dadada; font: inherit; font-size: 13px">Unlink</button>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid #363636">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: #4ade80"></span>
        <span style="color: #ececec">Up to date</span>
        <span style="color: #9a9a9a">2 min ago</span>
        <span style="margin-left: auto; color: #9a9a9a">2,979 notes, 148 attachments</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #363636">
      <div style="flex: 1; display: flex; align-items: center; gap: 8px"><span style="color: #ececec">Pantalytics dashboard</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" role="img" aria-label="More info"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      </div>
      <button type="button" style="height: 30px; padding: 0 14px; border: 1px solid #404040; border-radius: 6px; background: #2f2f2f; color: #dadada; font: inherit; font-size: 13px">Open</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
